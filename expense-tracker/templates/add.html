<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZFS4HRQSCZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NFV9EZG7ZL');
  </script>
</head>
<body>

<!-- ── Hero ── -->
<div class="hero">
  <div class="hero-inner">
    <div>
      <h1>💳 Expense Tracker</h1>
      <p>Log your spending and stay on top of your budget.</p>
    </div>
    <a href="/expenses" class="btn-nav">View All Expenses →</a>
  </div>
</div>

<div class="shell">
  <div class="form-page-layout">
    <div class="card">
      <div class="card-header">
        <div class="icon">➕</div>
        <h2>Add Expense</h2>
      </div>
      <div class="form-body">
        <form action="/add" method="POST">
          <div class="field">
            <label for="name">Expense Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Grocery Run" required maxlength="80" />
          </div>
          <div class="field">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01" required />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn-primary">Add Expense</button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
